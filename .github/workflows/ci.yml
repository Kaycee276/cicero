name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Core & React Packages
        run: |
          pnpm --filter "@cicero-zcash/core" typecheck
          pnpm --filter "@cicero-zcash/react" lint

      - name: Run Automated Test Suite (33 Tests)
        run: pnpm test

      - name: Build Monorepo (@cicero-zcash/core, @cicero-zcash/react, apps/web)
        run: pnpm build

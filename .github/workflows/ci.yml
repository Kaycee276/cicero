name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core Package
        run: pnpm --filter "@cicero-zcash/core" build

      - name: Typecheck Core & React Packages
        run: |
          pnpm --filter "@cicero-zcash/core" typecheck
          pnpm --filter "@cicero-zcash/react" lint

      - name: Run Automated Test Suite (33 Tests)
        run: pnpm test

      - name: Build Monorepo (@cicero-zcash/core, @cicero-zcash/react, apps/web)
        run: pnpm build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan Secrets & Leaked Credentials
        run: bash scripts/check-secrets.sh

      - name: Check Code Formatting (Prettier)
        run: pnpm format:check

      - name: Build Workspace Packages (core & react)
        run: |
          pnpm build:core
          pnpm build:package

      - name: Lint All Packages (core, react, web)
        run: pnpm lint

      - name: Typecheck All Packages (core, react, web)
        run: pnpm typecheck

      - name: Run Automated Test Suites (All Packages)
        run: pnpm test

      - name: Build Monorepo (@cicero-zcash/core, @cicero-zcash/react, apps/web)
        run: pnpm build
